<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>DSH Team Bots</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237287fd'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='monospace' font-size='10' fill='%2324273a'%3EDSH%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/api/dsh-team/styles.css?v={{assetVersion}}">
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主内容</a>
  <div id="app" class="boot-screen">
    <div class="boot-mark">DSH</div>
    <div class="boot-copy">正在连接团队空间</div>
  </div>
  <!-- modal 常驻容器（#app 外）：render() 全量重建 #app 时永远碰不到这里，
       弹窗的遮罩/滚动位/输入焦点因此不会被轮询或重渲染拆掉。 -->
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <!-- marked + DOMPurify：聊天 markdown 渲染与消毒（vendor 拷贝，见 vendor/*/NOTICE）。
       defer 保持文档序执行，app.js 里二者缺一即回退纯文本，不会裸渲染。 -->
  <script src="/api/dsh-team/vendor/marked.js?v={{assetVersion}}" defer></script>
  <script src="/api/dsh-team/vendor/purify.min.js?v={{assetVersion}}" defer></script>
  <script type="module" src="/api/dsh-team/app.js?v={{assetVersion}}" defer></script>
</body>
</html>
