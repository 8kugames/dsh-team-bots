services:
  dsh-team:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        DSH_VERSION: ${DSH_VERSION:-}
        DSH_TEAM_AGENT_TEAM: ${DSH_TEAM_AGENT_TEAM:-0}
    image: dsh-team-bots:local
    pull_policy: never
    ports:
      - "${DSH_TEAM_PORT:-13080}:3080"
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DSH_TRUSTED_HOST: "${DSH_TRUSTED_HOST:-localhost,127.0.0.1}"
      DSH_HOST: "0.0.0.0"
      DSH_LISTEN_PORT: "3080"
      DSH_TELEMETRY_DISABLED: "1"
      DSH_PROFILE: "${DSH_TEAM_PROFILE:-team-bots}"
      DSH_TEAM_WORKSPACE: "/workspace"
      DSH_TEAM_DATA: "/workspace/.data"
      DSH_TEAM_MAX_RUNS: "${DSH_TEAM_MAX_RUNS:-3}"
      DSH_TEAM_RUN_TIMEOUT_MS: "${DSH_TEAM_RUN_TIMEOUT_MS:-900000}"
      DSH_TEAM_MAX_RUN_TOKENS: "${DSH_TEAM_MAX_RUN_TOKENS:-0}"
      DSH_TEAM_STALL_TIMEOUT_MS: "${DSH_TEAM_STALL_TIMEOUT_MS:-600000}"
      DSH_TEAM_CHAT_MAX_CHARS: "${DSH_TEAM_CHAT_MAX_CHARS:-800}"
      DSH_TEAM_AGENT_TEAM: "${DSH_TEAM_AGENT_TEAM:-0}"
      DSH_TEAM_MAX_TEAMMATES: "${DSH_TEAM_MAX_TEAMMATES:-3}"
      DSH_TEAM_MODEL_PRICES: "${DSH_TEAM_MODEL_PRICES:-}"
      NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org/}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - "${HOME}/.dsh:/home/node/.dsh"
      # Credentials overlay (after the RW dir mount): the container inherits the
      # host login read-only. Bot-side tampering (credentials.set) fails with
      # EROFS; note the host re-login swaps the inode (atomic temp+rename), so a
      # fresh host login requires a container restart to propagate.
      - "${HOME}/.dsh/.credentials.yaml:/home/node/.dsh/.credentials.yaml:ro"
      - "${DSH_TEAM_WORKSPACE_DIR:-./workspace}:/workspace"
      # Canonical shared skill pool lives at ~/.agents; bind it inside the
      # workspace (a host symlink at /workspace/.agents is not usable: Docker
      # Desktop's mount setup replaces it with an empty real directory).
      # Host capability bridge (absolute paths referenced by ~/.dsh patches)
      # is discovered and generated into docker-compose.host-caps.yml at
      # every start — use `npm run docker:up`, not a bare `docker compose up`.
      - "${HOME}/.agents:/workspace/.agents"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net'),os=require('os');const ip=Object.values(os.networkInterfaces()).flat().find(i=>i&&i.family==='IPv4'&&!i.internal)?.address||'127.0.0.1';const s=net.connect(3080,ip,()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));setTimeout(()=>process.exit(1),2000)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
