name: publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-save
          fi
      - run: npm run typecheck
      - run: npm test
      # trusted publishing 硬条件：npm CLI ≥ 11.5.1 才支持 OIDC 换 token，node 22 自带 npm 10.x 必须先升级
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install -g npm@latest
          npm --version
          node -e "const [maj,min]=process.argv[1].split('.').map(Number);if(maj<11||(maj===11&&min<5)){console.error('npm >= 11.5.1 required for OIDC trusted publishing');process.exit(1)}" "$(npm --version)"
      - run: npm publish
